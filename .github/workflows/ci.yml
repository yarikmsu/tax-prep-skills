name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report both. Cancelling the sibling on the first failure is what makes a
      # version-specific break look like a plain break.
      fail-fast: false
      matrix:
        # 3.12 is what requirements.txt is compiled for and what the project
        # ships against. 3.14 is what `python3 -m venv` gives a contributor on a
        # current macOS today, and a local green there said nothing about this
        # job until it ran here too: `Popen.communicate()` re-flushes a stdin the
        # caller already closed, which raises on 3.12 and not on 3.13+, so a test
        # passed locally and failed in CI on the interpreter alone.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  pii-scan:
    name: PII file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed files and content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Calls the SAME script the pre-commit hook runs, with a commit range
        # instead of --cached. These rules used to be hand-mirrored here, and
        # every one had to be edited in both places or the gate diverged in
        # silence — which is exactly how four content-scan bypasses shipped to
        # the hook and to the copy at the same time.
        run: bash scripts/pre-commit-pii-scan.sh "${BASE_SHA}...HEAD"

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
