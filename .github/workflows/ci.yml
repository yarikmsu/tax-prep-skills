name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -v

  pii-scan:
    name: PII file scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed files and content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Calls the SAME script the pre-commit hook runs, with a commit range
        # instead of --cached. These rules used to be hand-mirrored here, and
        # every one had to be edited in both places or the gate diverged in
        # silence — which is exactly how four content-scan bypasses shipped to
        # the hook and to the copy at the same time.
        run: bash scripts/pre-commit-pii-scan.sh "${BASE_SHA}...HEAD"

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
